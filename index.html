--bg-center:#111A2E; --bg-edge:#03050C; --bg-flat:#0D1524; --glow:#243252;
--gold-flat:#C9A24C; --gold-hi:#F8ECC0; --gold-dark:#7C5E20;
--g1:#F4E4A6; --g2:#E7CA7A; --g3:#C49B42; --g4:#8F6C28; --g5:#DFBE6C;
--paper:#F6F3ED; --muted:#AFB6CB;
--ok:#9AD1AC; --ok-fill:#1D4A38; --bad:#E39A91; --bad-fill:#5A1F24;
--strike:#C94F4F; --warm:#E0A458; --tile-val:#F4E4A6;
--t1:#C9A24C; --t2:#6E86B8; --t3:#E8E2D4; --t4:#C97C74; --t5:#8FAE9B; --t6:#9BA5B4;
--grad-gold:linear-gradient(135deg,var(--g1) 0%,var(--g2) 30%,var(--g3) 58%,var(--g4) 82%,var(--g5) 100%);
--sp:8px; --rad:14px; --rad-s:9px;
--fs-scale:1;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
font-family:'Manrope',system-ui,sans-serif;font-weight:500;color:var(--paper);
background:var(--bg-flat);overflow:hidden;user-select:none;-webkit-user-select:none;
}
#bg{position:fixed;inset:0;z-index:0;
background:radial-gradient(120% 90% at 50% 38%,var(--bg-center) 0%,var(--bg-edge) 100%);}
#bg::before{content:"";position:absolute;inset:0;
background:radial-gradient(60% 50% at 50% 42%,rgba(36,50,82,.42) 0%,rgba(36,50,82,0) 100%);}
#bg::after{content:"";position:absolute;inset:0;opacity:.05;background-image:var(--grain);background-size:280px 280px}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.display{font-family:'Marcellus',serif;font-weight:400;letter-spacing:.02em}
.serifnum{font-family:'Cormorant Garamond','Cormorant',serif;font-weight:600;font-feature-settings:'lnum' 1,'tnum' 1}
.pscore,.pbar .r,.finaltable b,.stepper .v,.bigstep .wv{font-feature-settings:'lnum' 1,'tnum' 1}
.goldtext{background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.mut{color:var(--muted)}
h1.display{font-size:calc(58px*var(--fs-scale))}
#topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
padding:calc(var(--sp)*1.5) calc(var(--sp)*3);min-height:58px}
#topbar .brand{display:flex;align-items:center;gap:10px;font-family:'Marcellus',serif;
font-size:calc(17px*var(--fs-scale));letter-spacing:.14em;color:var(--gold-flat)}
#topbar .brand svg{flex:none}
#topbar .brand span{white-space:nowrap}
#topbar .stage-label{font-size:calc(15px*var(--fs-scale));letter-spacing:.22em;color:var(--muted);text-transform:uppercase;text-align:center}
#topbar .right{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.chip{border:1px solid rgba(201,162,76,.45);border-radius:999px;padding:5px 13px;
font-size:calc(13px*var(--fs-scale));letter-spacing:.06em;color:var(--muted);white-space:nowrap}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
padding:0 calc(var(--sp)*3);min-height:0}
#teamrail{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
padding:calc(var(--sp)*1.5) calc(var(--sp)*2) calc(var(--sp)*2.5)}
.team{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;
min-width:clamp(120px,13vw,190px);padding:10px 22px 9px;border-radius:var(--rad-s);
background:rgba(13,21,36,.72);border:2px solid rgba(175,182,203,.22);cursor:pointer;transition:border-color .18s,transform .18s}
.team .nm{font-size:calc(15px*var(--fs-scale));letter-spacing:.05em;color:var(--muted);max-width:150px;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .sc{font-family:'Cormorant Garamond','Cormorant',serif;font-weight:600;font-size:clamp(30px,3.4vw,calc(46px*var(--fs-scale)));line-height:1.04;color:var(--g1);font-feature-settings:'lnum' 1,'tnum' 1}
.team .sc.neg{color:var(--bad)}
.team.active{border-color:var(--acc,var(--gold-flat));box-shadow:0 0 0 1px rgba(201,162,76,.25),0 6px 22px -12px rgba(201,162,76,.55)}
.team .dot{position:absolute;top:7px;left:9px;width:8px;height:8px;border-radius:50%;background:var(--acc,var(--gold-flat))}
.team.pulse{animation:pulse .9s ease 1}
@keyframes pulse{40%{transform:scale(1.05)}}
#dock{position:fixed;right:14px;bottom:14px;z-index:40;display:flex;gap:8px}
#dock button{width:46px;height:46px;border-radius:12px;border:1px solid rgba(201,162,76,.4);
background:rgba(13,21,36,.82);color:var(--gold-flat);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#dock button:hover{border-color:var(--gold-flat)}
#volpop{position:fixed;right:14px;bottom:70px;z-index:41;background:#111A2E;border:1px solid rgba(201,162,76,.5);
border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:10px}
#volpop input{accent-color:var(--gold-flat);width:140px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;
border-radius:999px;font-family:'Manrope',sans-serif;font-weight:600;letter-spacing:.05em;
transition:transform .15s,filter .15s,border-color .15s;text-transform:none}
.btn:active{transform:scale(.97)}
.btn-gold{background:var(--grad-gold);color:var(--bg-flat);height:calc(56px*var(--fs-scale));padding:0 34px;font-size:calc(17px*var(--fs-scale));
box-shadow:0 10px 26px -12px rgba(196,155,66,.55)}
.btn-gold:hover{filter:brightness(1.06)}
.btn-quiet{background:transparent;color:var(--gold-flat);border:1px solid rgba(201,162,76,.55);
height:calc(48px*var(--fs-scale));padding:0 24px;font-size:calc(15px*var(--fs-scale))}
.btn-quiet:hover{border-color:var(--gold-flat);color:var(--gold-hi)}
.btn-ghost{background:transparent;color:var(--muted);border:none;font-size:calc(14px*var(--fs-scale));height:40px;padding:0 14px}
.btn-ghost:hover{color:var(--paper)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-danger{background:var(--bad-fill);color:var(--bad);border:1px solid rgba(227,154,145,.45);height:48px;padding:0 24px;font-size:15px;border-radius:999px}
#s0{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer}
#s0 .mark{width:min(300px,56vw);margin-bottom:26px;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.02)}}
#s0 h1{font-size:clamp(40px,7vw,74px);letter-spacing:.16em;margin-bottom:6px}
#s0 .sub{font-family:'Marcellus',serif;letter-spacing:.5em;color:var(--muted);font-size:clamp(13px,2vw,19px);margin-bottom:44px;text-indent:.5em}
#s0 .hint{margin-top:22px;font-size:14px;color:var(--muted);letter-spacing:.08em}
#s0 .ver{position:absolute;bottom:18px;font-size:12.5px;color:var(--muted);opacity:.8;letter-spacing:.12em}
.rule{width:220px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dark),transparent);margin:0 auto}
.homegrid{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;max-width:980px}
.modecard{width:min(400px,88vw);border-radius:var(--rad);padding:30px 30px 26px;cursor:pointer;text-align:left;
background:linear-gradient(160deg,rgba(36,50,82,.35),rgba(13,21,36,.9));border:1px solid rgba(201,162,76,.35);
transition:transform .2s,border-color .2s,box-shadow .2s}

/* ============ BIBLIOTEKA PAKIETÓW ============ */
const PACK_KEY = 'llk.packs.v1';
const LIMITS = { title:60, cat:24, q:200, a:120, team:20 };
const AUDIENCE = { 'family-8plus':'Family 8+', 'kids':'Kids 5+', 'teens-adults':'Teens & adults', 'office':'Office & team', 'classroom':'Classroom' };
let CUSTOM = [];          // pakiety użytkownika (z pamięci przeglądarki)

function factoryPacks(){ return [FACTORY_GRID].concat(typeof FACTORY_BOARD!=='undefined' ? [FACTORY_BOARD] : []); }
function allPacks(type){
  const all = factoryPacks().concat(CUSTOM);
  return type ? all.filter(p=>p.type===type) : all;
}
function packById(id){ return allPacks().find(p=>p.id===id) || null; }
function isFactory(p){ return factoryPacks().some(f=>f.id===p.id); }
function savePacks(){ try{ localStorage.setItem(PACK_KEY, JSON.stringify(CUSTOM)); return true; }catch(e){ return false; } }
function loadPacks(){
  try{
    const raw = localStorage.getItem(PACK_KEY); if(!raw) return;
    const arr = JSON.parse(raw);
    if(Array.isArray(arr)) CUSTOM = arr.filter(p=>p && p.kind==='larklock-pack' && p.id);
  }catch(e){ CUSTOM = []; }
}
function newId(){ return 'p' + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'pack'; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function countQuestions(p){
  if(p.type==='grid' && p.grid) return p.grid.categories.reduce((n,c)=>n+c.tiles.length,0);
  if(p.type==='match' && p.match) return (p.match.rounds||[]).length;
  return 0;
}

/* walidacja wg SPEC 6.3 — zwraca listę twardych błędów i ostrzeżeń */
function validatePack(p){
  const E=[], W=[];
  if(!p || typeof p!=='object') return {errors:['This file is not readable.'],warnings:[]};
  if(p.kind!=='larklock-pack') E.push("This file isn't a Larklock pack. Choose a .json file exported from Question Studio.");
  if((p.formatVersion||0) > 1) E.push('This pack was made in a newer version of the game. Update the game file to use it.');
  if(!['grid','match'].includes(p.type)) E.push('Unknown pack type.');
  if(!p.title || !String(p.title).trim()) E.push('The pack needs a title.');
  if(p.title && String(p.title).length>LIMITS.title) E.push(`Title is longer than ${LIMITS.title} characters.`);
  if(p.type==='grid'){
    const g=p.grid;
    if(!g || !Array.isArray(g.categories)) { E.push('This grid pack has no categories.'); return {errors:E,warnings:W}; }
    if(g.categories.length<3) E.push('A grid pack needs at least 3 categories.');
    if(g.categories.length>6) E.push('A grid pack can have at most 6 categories.');
    g.categories.forEach((c,ci)=>{
      const where = `“${c.name||'category '+(ci+1)}”`;
      if(!c.name || !String(c.name).trim()) E.push(`Category ${ci+1}: name this category.`);
      else if(c.name.length>LIMITS.cat) E.push(`Category ${ci+1}: name is longer than ${LIMITS.cat} characters.`);
      if(!Array.isArray(c.tiles) || c.tiles.length!==5) E.push(`${where}: a category needs exactly 5 questions.`);
      (c.tiles||[]).forEach((t,ti)=>{
        const val = (t && t.value) || (ti+1)*100;
        if(!t || !String(t.question||'').trim()) E.push(`${where} · ${val}: the question is empty.`);
        else if(t.question.length>LIMITS.q) E.push(`${where} · ${val}: question is longer than ${LIMITS.q} characters.`);
        if(!t || !String(t.answer||'').trim()) E.push(`${where} · ${val}: the answer is empty.`);
        else if(t.answer.length>LIMITS.a) E.push(`${where} · ${val}: answer is longer than ${LIMITS.a} characters.`);
      });
    });
    const seen={};
    g.categories.forEach(c=>(c.tiles||[]).forEach(t=>{
      const k=String(t&&t.question||'').trim().toLowerCase(); if(!k) return;
      if(seen[k]) W.push(`This question appears twice: “${t.question.slice(0,50)}”`); else seen[k]=1;
    }));
    if(!g.final || !String(g.final.question||'').trim()) W.push('No final question — The Final Lock will be switched off.');
    if(!Array.isArray(g.tiebreakers) || g.tiebreakers.length<1) W.push('No tiebreaker questions — ties will need a host decision.');
  }
  if(p.type==='match'){
    const m=p.match;
    if(!m || !Array.isArray(m.rounds) || !m.rounds.length){ E.push('This pack has no rounds yet.'); return {errors:E,warnings:W}; }
    m.rounds.forEach((r,ri)=>{
      if(!String(r.prompt||'').trim()) E.push(`Round ${ri+1}: the prompt is empty.`);
      if(!Array.isArray(r.answers) || r.answers.length<3) E.push(`Round ${ri+1}: a round needs at least 3 answers.`);
      if((r.answers||[]).length>8) E.push(`Round ${ri+1}: a round can have at most 8 answers.`);
      (r.answers||[]).forEach((a,ai)=>{
        if(!String(a.text||'').trim()) E.push(`Round ${ri+1} · answer ${ai+1}: the text is empty.`);
        const pt = Number(a.points);
        if(!Number.isFinite(pt) || pt<1 || pt>99) E.push(`Round ${ri+1} · answer ${ai+1}: points must be between 1 and 99.`);
      });
      const sum=(r.answers||[]).reduce((n,a)=>n+(Number(a.points)||0),0);
      if(sum<70 || sum>110) W.push(`Round ${ri+1}: points add up to ${sum} (totals near 100 feel fair).`);
    });
    if(!Array.isArray(m.quickfire) || m.quickfire.length!==5) W.push('Quickfire needs all 5 prompts — the finale will be switched off.');
  }
  return {errors:E, warnings:W};
}

/* eksport / import plików (SPEC ograniczenie #4: pliki są jedynym pewnym zapisem) */
function downloadJSON(obj, filename){
  try{
    const blob = new Blob([JSON.stringify(obj,null,1)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
    return true;
  }catch(e){ return false; }
}
function copyFallback(obj){
  showModal(`<h3 class="mt goldtext">${T.copyPack}</h3><p>${T.copyPackHelp}</p>
    <textarea id="packtext" style="width:100%;height:180px;background:#0B1222;color:var(--paper);border:1px solid rgba(201,162,76,.4);border-radius:10px;padding:12px;font-family:monospace;font-size:12px;user-select:text;-webkit-user-select:text"></textarea>
    <div class="mactions"><button class="btn btn-ghost" data-act="mcancel">${T.close}</button>
    <button class="btn btn-gold" data-act="copytext">${T.copy}</button></div>`);
  const ta=$('#packtext'); if(ta) ta.value = JSON.stringify(obj,null,1);
}
function exportPack(p){
  const name = `larklock-pack-${slug(p.title)}.json`;
  const data = clone(p); delete data.id;
  if(!downloadJSON(data, name)) copyFallback(data);
  else toast(T.exported, 'okt', 1600);
}
function pickFile(cb){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.addEventListener('change', ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{ try{ cb(JSON.parse(String(fr.result))); }catch(e){ cb(null); } };
    fr.onerror = ()=>cb(null);
    fr.readAsText(f);
  });
  inp.click();
}

const MULTIPLIERS = { 3:[1,2,3], 4:[1,1,2,3], 5:[1,1,2,2,3] };

function freshBoardMatch(cfg){
  const pack = cfg.pack || FACTORY_BOARD;
  return {
    v:1, mode:'match', screen:'bboard',
    pack: clone(pack), packTitle: pack.title,
    teams: cfg.teams.map((n,i)=>({name:n, score:0, acc:i})),
    active: 0, round: 1,
    cfg: { rounds: cfg.rounds, faceoff: cfg.faceoff, quickfire: cfg.quickfire, qfTarget: cfg.qfTarget },
    r: null, qf: null, started: Date.now(),
  };
}
function boardPack(){ return (S.pack && S.pack.match) ? S.pack.match : FACTORY_BOARD.match; }
function roundMult(){ const m = MULTIPLIERS[S.cfg.rounds] || MULTIPLIERS[4]; return m[Math.min(S.round-1, m.length-1)]; }
function startRoundBoard(){
  const rd = boardPack().rounds[(S.round-1) % boardPack().rounds.length];
  S.r = {
    prompt: rd.prompt,

function revealSlot(i, toBank=true){
  const R=S.r, s=R.slots[i];
  if(s.revealed) return false;
  s.revealed = true;
  if(toBank){ R.bank += s.points * roundMult(); SFX.reveal(); }
  else { s.zero = true; }
  return true;
}
function bTapSlot(i){
  const R=S.r;
  if(R.phase==='faceoff' && (R.fo.step==='first'||R.fo.step==='second')){
    if(R.slots[i].revealed) return;
    pushHist(`Face-off hit — ${R.slots[i].text}`);
    revealSlot(i);
    if(R.fo.step==='first'){
      R.fo.firstRank = i;
      if(i===0){ R.r_choice = R.fo.first; R.phase='choose'; }
      else { R.fo.step='second'; R.fo.second = otherFaceoffTeam(); }
    } else {
      R.r_choice = (R.fo.firstRank===null || i < R.fo.firstRank) ? R.fo.second : R.fo.first;
      R.phase='choose';
    }
    saveSnap(); render(); return;
  }
  if(R.phase==='play'){
    if(R.slots[i].revealed) return;
    pushHist(`Answer — ${R.slots[i].text}`);
    revealSlot(i);
    if(R.slots.every(s=>s.revealed)){ awardBank(R.playing); return; }
    saveSnap(); render(); return;
  }
  if(R.phase==='stealpick'){
    if(R.slots[i].revealed) return;
    pushHist(`Steal hit — ${R.slots[i].text}`);
    revealSlot(i);
    awardBank(R.stealTeam);
    return;
  }
  if(R.phase==='flip'){
    if(R.slots[i].revealed) return;
    revealSlot(i,false); saveSnap(); render();
  }
}
function otherFaceoffTeam(){
  const R=S.r;
  const order = S.teams.map((t,i)=>i).filter(i=>i!==R.fo.first);
  if(order.length===1) return order[0];
  const sorted = order.slice().sort((a,b)=>S.teams[a].score-S.teams[b].score);
  return sorted[0];
}

function pickWagerTiles(cats, count, round){

/* ============ AUDIO (WebAudio synteza — SPEC 9) ============ */
const AU = { ctx:null, master:null };
function audioInit(){
  try{
    AU.ctx = new (window.AudioContext||window.webkitAudioContext)();
    AU.master = AU.ctx.createGain();
    AU.master.gain.value = UI.muted ? 0 : UI.vol;
    AU.master.connect(AU.ctx.destination);
    UI.audioOk = true;
  }catch(e){ UI.audioOk = false; }
}
function audioResume(){ if(AU.ctx && AU.ctx.state==='suspended'){ AU.ctx.resume().catch(()=>{}); } }
function setVol(){ if(AU.master) AU.master.gain.value = UI.muted ? 0 : UI.vol; }
function tone(freq, t0, dur, type='sine', gain=0.18, glide=0){
  if(!AU.ctx) return;
  const o = AU.ctx.createOscillator(), g = AU.ctx.createGain(), f = AU.ctx.createBiquadFilter();
  f.type='lowpass'; f.frequency.value = 4200;
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if(glide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+glide), t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(f); f.connect(g); g.connect(AU.master);
  o.start(t0); o.stop(t0+dur+0.05);
}
const SFX = {
  chime(){ if(!AU.ctx) return; audioResume(); const t=AU.ctx.currentTime;
    [523.25,659.25,784].forEach((f,i)=>{ tone(f,t+i*0.09,0.9,'sine',0.14); tone(f*2,t+i*0.09,0.35,'triangle',0.03); }); },
  reveal(){ if(!AU.ctx) return; audioResume(); const t=AU.ctx.currentTime;
    tone(1318.5,t,0.4,'sine',0.1); tone(1975,t+0.04,0.25,'sine',0.05); },
  correct(){ if(!AU.ctx) return; audioResume(); const t=AU.ctx.currentTime;
    [523.25,659.25,784].forEach(f=>tone(f,t,0.7,'triangle',0.11));
    tone(1046.5,t+0.12,0.5,'sine',0.07); },
  wrong(){ if(!AU.ctx) return; audioResume(); const t=AU.ctx.currentTime;
    tone(155,t,0.34,'sawtooth',0.1,-40); tone(110,t,0.34,'sawtooth',0.07,-20); },
  gong(){ if(!AU.ctx) return; audioResume(); const t=AU.ctx.currentTime;
    tone(220,t,1.3,'sine',0.16); tone(331,t,1.1,'sine',0.06); tone(440,t+0.02,0.7,'sine',0.04); },
  /* bez audioResume(): iOS wznawia kontekst tylko w obsłudze gestu (konsultacja nr 2) */
  tick(){ if(!AU.ctx || AU.ctx.state!=='running') return; tone(900,AU.ctx.currentTime,0.03,'square',0.03); },
  bank(){ if(!AU.ctx) return; audioResume(); const t=AU.ctx.currentTime;
    /* glissando harfy + dzwon — przyznanie banku (SPEC 9.2) */
    [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,t+i*0.055,0.5,'triangle',0.08));
    tone(1567.98,t+0.3,0.9,'sine',0.06); },
  wager(){ if(!AU.ctx) return; audioResume(); const t=AU.ctx.currentTime;
    for(let i=0;i<7;i++) tone(120+i*4,t+i*0.1,0.09,'sine',0.1);
    tone(240,t+0.75,0.5,'sine',0.12); },
  fanfare(){ if(!AU.ctx) return; audioResume(); const t=AU.ctx.currentTime;
    [392,523.25,659.25,784].forEach((f,i)=>tone(f,t+i*0.11,0.5,'triangle',0.1));
    [523.25,659.25,784,1046.5].forEach(f=>tone(f,t+0.5,1.1,'triangle',0.08)); },
};

function saveSnap(){
  if(!UI.storageOk || !S) return;
  try{ localStorage.setItem(SNAP_KEY, JSON.stringify(S)); }catch(e){}
}
function clearSnap(){ try{ localStorage.removeItem(SNAP_KEY); }catch(e){} }
function loadSnap(){
  if(!UI.storageOk) return null;
  try{
    const raw = localStorage.getItem(SNAP_KEY); if(!raw) return null;
    const s = JSON.parse(raw);
    if(s && s.v===1 && Array.isArray(s.teams) && ((s.mode==='grid' && s.cats) || (s.mode==='match' && s.pack))) return s;
    clearSnap(); return null;
  }catch(e){ clearSnap(); return { __broken:true }; }
}

function pushHist(label){
  if(!S) return;
  HIST.push({ label, time: Date.now(), snap: JSON.stringify(S) });
  if(HIST.length>50) HIST.shift();
}
function undo(){
  if(!HIST.length || !S){ toast(T.nothingUndo); return; }
  const h = HIST.pop();
  S = JSON.parse(h.snap);
  stopTimer(false);
  /* wznów dokładnie ten zegar, który działał w odtworzonym stanie (konsultacja nr 3) */

  if(S.final && S.final._timerRunning) startFinalTimer();
  if(S.qf && S.qf.running) startQfTimer();
  toast(T.undone(h.label));
  saveSnap(); render();
}

function topbarHTML(stageLabel, right=''){
  return `<div id="topbar">
    <div class="brand">${markSVG(30)}<span>LARKLOCK</span>${S?`<span class="modeName">· ${S.mode==='match'?T.playBoard:T.playGrid}</span>`:''}</div>
    <div class="stage-label">${esc(stageLabel||'')}</div>
    <div class="right">${right}</div>
  </div>`;
}
function teamrailHTML(clickable=true){
  if(!S) return '';
  return `<div id="teamrail">` + S.teams.map((t,i)=>`
    <div class="team ${i===S.active?'active':''} focusable" data-team="${i}" tabindex="0" role="button"
         style="--acc:${TEAM_ACC[t.acc]}" title="${clickable?'Set active team ('+(i+1)+')':''}">
      <span class="dot"></span>
      <span class="nm">${esc(t.name)}</span>
      <span class="sc ${t.score<0?'neg':''}">${t.score}</span>
    </div>`).join('') + `</div>`;
}
function dockHTML(){
  return `<div id="dock">
    <button data-act="undo" title="${T.undo} (U)" aria-label="${T.undo}">↺</button>

/* ---------- S3 PLANSZA ---------- */
function renderBoard(app){
  const n = S.cats.length;
  const catCells = S.cats.map(c=>`<div class="cat">${esc(c.name)}</div>`).join('');
  let tiles='';
  for(let row=0; row<5; row++){
    for(let ci=0; ci<n; ci++){
      const t = S.cats[ci].tiles[row];
      const val = t.value * (S.round===2?2:1);
      tiles += `<div class="tile focusable ${t.state==='played'?'done':''} ${t.state==='peeked'?'peeked':''}"
        data-ci="${ci}" data-ti="${row}" tabindex="${t.state==='played'?-1:0}" role="button"
        aria-label="${esc(S.cats[ci].name)} for ${val}"><span class="v">${val}</span></div>`;
    }
  }
  app.innerHTML = topbarHTML(T.roundOf(S.round, S.cfg.rounds),
      `<span class="chip">${esc(S.packTitle)}</span>`) +
    `<div id="stage"><div class="boardwrap">
      <div class="cats" style="grid-template-columns:repeat(${n},1fr)">${catCells}</div>
      <div class="grid" style="grid-template-columns:repeat(${n},1fr);grid-template-rows:repeat(5,1fr)">${tiles}</div>
    </div></div>` + teamrailHTML() + dockHTML();
  maybeRoundComplete();
}
function allPlayed(){ return S.cats.every(c=>c.tiles.every(t=>t.state==='played')); }
function maybeRoundComplete(){
  if(!allPlayed()) return;
  const last = S.round >= S.cfg.rounds;
  const next = last ? (S.cfg.finalOn ? T.goFinal : T.seeResults) : T.startRound2;
  showModal(`<h3 class="mt goldtext">${T.roundComplete(S.round)}</h3>
    <div class="finaltable">${[...S.teams].sort((a,b)=>b.score-a.score).map(t=>
      `<div class="frow"><span>${esc(t.name)}</span><b class="serifnum">${t.score}</b></div>`).join('')}</div>
    <div class="mactions"><button class="btn btn-gold" data-act="roundnext">${next}</button></div>`, false);
}
function roundNext(){
  closeModal();
  if(S.round < S.cfg.rounds){
    pushHist(`${T.roundN(S.round)} → ${T.roundN(S.round+1)}`);
    S.round++;
    S.cats.forEach(c=>c.tiles.forEach(t=>t.state='idle'));
    S.wagerTiles = pickWagerTiles(S.cats, S.cfg.wagers, S.round);
    saveSnap(); render();
  } else if(S.cfg.finalOn && gridPack().final && String(gridPack().final.question||'').trim()){
    pushHist('→ '+T.finalTitle);
    S.screen='final';
    S.final = { step:1, wagers:S.teams.map(()=>0), judged:S.teams.map(()=>null), tbIdx:0, revealed:false };
    saveSnap(); render();
  } else finishToResults();
}
function finishToResults(){
  /* migawkę ZOSTAWIAMY: odświeżenie na ekranie wyników nie kasuje wieczoru (konsultacja nr 2) */
  S.screen='results'; stopTimer(); saveSnap(); render();
  SFX.fanfare();
}

/* ---------- S4 KARTA PYTANIA + WAGER ---------- */
function openTile(ci, ti){
  const t = S.cats[ci].tiles[ti];
  if(t.state==='played') return;
  const isWager = S.wagerTiles.includes(ci+':'+ti);
  if(isWager){
    S.screen='wager';
    S.q = { ci, ti, revealed:false, missed:[], stealMode:false,
            wager:{ amount:100, locked:false } };
    SFX.wager();
  } else {
    S.screen='question';
    S.q = { ci, ti, revealed:false, missed:[], stealMode:false, wager:null };
  }
  saveSnap(); render();
}
function gridPack(){ return (S.pack && S.pack.grid) ? S.pack.grid : FACTORY_GRID.grid; }
function tileVal(){ return S.cats[S.q.ci].tiles[S.q.ti].value * (S.round===2?2:1); }
function wagerMax(){
  const top = 500*(S.round===2?2:1);
  return Math.max(S.teams[S.active].score, top);
}
function renderWager(app){
  const w = S.q.wager, team = S.teams[S.active];
  app.innerHTML = `<div class="wagersplash">
    <h2 class="goldtext">${T.wagerTitle}</h2>
    <div class="wpanel">
      <div style="font-size:18px">${esc(T.setWager(team.name))}</div>
      <div class="lim">${T.minMax(100, wagerMax())}</div>
      <div class="bigstep">
        <button data-act="wminus" aria-label="lower wager">−</button>
        <span class="wv">${w.amount}</span>
        <button data-act="wplus" aria-label="raise wager">+</button>
      </div>
      <button class="btn btn-gold" data-act="wlock">${T.lockIn}</button>
    </div>
  </div>` + dockHTML();
}
function renderQuestion(app){
  const {ci,ti} = S.q, tile = S.cats[ci].tiles[ti];
  const val = S.q.wager ? S.q.wager.amount : tileVal();
  const catName = S.q.wager ? T.wagerTitle.replace('!','') : S.cats[ci].name;
  const timerHTML = S.cfg.timerSec>0 ? timerChip() : '';
  let actions='';
  if(!S.q.revealed){
    actions = `<div class="qactions">
      ${timerHTML}
      <button class="btn btn-gold" data-act="reveal">${T.reveal}<span class="kbd mut" style="font-size:12px;margin-left:4px">␣</span></button>
      <button class="btn btn-ghost" data-act="closeq">${T.close}</button>
    </div>`;
  } else if(S.q.wager){
    const t = S.teams[S.active];
    actions = `<div class="awardrow"><span class="who">${esc(t.name)}</span>
      <div class="tchip okv" data-award="${S.active}" style="--acc:${TEAM_ACC[t.acc]}" role="button" tabindex="0">
        <span class="nm">✓ ${T.correct}</span><span class="pt">+${val}</span></div>
      <div class="tchip badv" data-misswager="1" style="--acc:${TEAM_ACC[t.acc]}" role="button" tabindex="0">
        <span class="nm">✗ ${T.wrong}</span><span class="pt">−${val}</span></div>
    </div>`;
  } else if(S.q.stealMode){
    const left = S.teams.map((t,i)=>i).filter(i=>i!==S.active && !S.q.missed.includes(i));
    actions = `<div class="awardrow"><span class="who">${T.stealOpen}</span>` +
      left.map(i=>`<div class="tchip okv" data-steal="${i}" style="--acc:${TEAM_ACC[S.teams[i].acc]}" role="button" tabindex="0">
          <span class="nm">${esc(S.teams[i].name)}</span><span class="pt">+${val}</span></div>`).join('') + `</div>` +
      (left.length>1 ? `<div class="awardrow"><span class="who">${T.stealMissWho}</span>` +
        left.map(i=>`<div class="tchip badv" data-stealmiss="${i}" style="--acc:${TEAM_ACC[S.teams[i].acc]}" role="button" tabindex="0">
          <span class="nm">${esc(S.teams[i].name)}</span><span class="pt">${T.stealMissed}</span></div>`).join('') + `</div>` : '') +
      `<div class="qactions"><button class="btn btn-ghost" data-act="noone">${T.noOne}</button></div>`;
  } else {
    const missBtns = S.cfg.classic ?
      `<div class="awardrow"><span class="who">${T.missWho}</span>` +
        S.teams.map((t,i)=> S.q.missed.includes(i) ? '' :
        `<div class="tchip badv" data-miss="${i}" style="--acc:${TEAM_ACC[t.acc]}" role="button" tabindex="0">
          <span class="nm">${esc(t.name)}</span><span class="pt">−${val}</span></div>`).join('') + `</div>` : '';
    actions = `<div class="awardrow"><span class="who">${T.whoRight}</span>` +
      S.teams.map((t,i)=>`<div class="tchip okv" data-award="${i}" style="--acc:${TEAM_ACC[t.acc]}" role="button" tabindex="0">
          <span class="nm">${esc(t.name)}</span><span class="pt">+${val}</span></div>`).join('') + `</div>`
      + missBtns +
      `<div class="qactions">${S.cfg.steals && !S.cfg.classic ? `<button class="btn btn-quiet" data-act="firstmiss">${T.openSteal}</button>`:''}
        <button class="btn btn-ghost" data-act="noone">${T.noOne}</button></div>`;
  }
  app.innerHTML = topbarHTML(T.roundOf(S.round,S.cfg.rounds)) +
  `<div id="stage"><div class="qcard">
    <div class="qhead"><span class="cat">${esc(catName)}</span><span>·</span><span class="val">${val}</span></div>
    <div class="qtext">${esc(tile.question)}</div>
    <div class="answrap">${ S.q.revealed
      ? `<div class="anstext">${esc(tile.answer)}</div>`
      : `<div class="anshidden">${markSVG(22)}<span>Answer locked</span></div>` }
    ${actions}</div>
  </div></div>` + teamrailHTML(false) + dockHTML();
  if(S.q._timerRunning) startTimerLoop();
}
function timerChip(){
  const sec = S.q._timerLeft!=null ? Math.ceil(S.q._timerLeft) : S.cfg.timerSec;
  const frac = (S.q._timerLeft!=null ? S.q._timerLeft : S.cfg.timerSec)/S.cfg.timerSec;
  const C = 2*Math.PI*28;
  const cls = S.q._timerLeft===0 ? 'done' : (sec<=5 ? 'low':'');
  return `<div class="timer ${cls}" data-act="timer" title="T">
    <svg width="64" height="64"><circle cx="32" cy="32" r="28" fill="none" stroke="rgba(175,182,203,.2)" stroke-width="4"/>
    <circle cx="32" cy="32" r="28" fill="none" stroke="${sec<=5?'var(--warm)':'var(--gold-flat)'}" stroke-width="4"
      stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg>
    <span class="tv">${S.q._timerLeft===0 ? T.timeUp : (S.q._timerRunning? sec : '▶')}</span></div>`;
}
function toggleTimer(){
  if(!S.q || S.cfg.timerSec===0) return;
  if(S.q._timerLeft===0) { S.q._timerLeft=null; S.q._timerRunning=false; render(); return; }
  S.q._timerRunning = !S.q._timerRunning;
  if(S.q._timerLeft==null) S.q._timerLeft = S.cfg.timerSec;
  if(S.q._timerRunning) startTimerLoop(); else stopTimer(false);
  render();
}
let timerRAF=null, timerLast=0, lastTickSec=null;
function startTimerLoop(){
  stopTimer(false); timerLast = performance.now();
  const step = now=>{
    if(!S || !S.q || !S.q._timerRunning) return;
    S.q._timerLeft = Math.max(0, S.q._timerLeft - (now-timerLast)/1000);
    timerLast = now;
    const sec = Math.ceil(S.q._timerLeft);
    if(sec<=5 && sec!==lastTickSec && S.q._timerLeft>0){ lastTickSec=sec; SFX.tick(); }
    const chip = document.querySelector('.timer');
    if(chip){ chip.outerHTML = timerChip(); }
    if(S.q._timerLeft<=0){ S.q._timerRunning=false; SFX.gong(); render(); return; }
    timerRAF = requestAnimationFrame(step);
  };
  timerRAF = requestAnimationFrame(step);
}
function stopTimer(clear=true){
  if(timerRAF) cancelAnimationFrame(timerRAF); timerRAF=null; lastTickSec=null;
  if(clear && S && S.q){ S.q._timerRunning=false; }
}

/* rozstrzygnięcia */
function applyScore(i, delta, label){
  pushHist(label);
  S.teams[i].score += delta;
  if(!S.cfg.classic && S.teams[i].score < 0) S.teams[i].score = 0; /* podłoga zero — SPEC 5.1 */
}
function settleTile(nextActive){
  const {ci,ti} = S.q;
  S.cats[ci].tiles[ti].state='played';
  if(nextActive!=null) S.active = nextActive;
  S.q=null; stopTimer(); S.screen='board';
  saveSnap(); render();
}
function award(i){
  const val = S.q.wager ? S.q.wager.amount : tileVal();
  applyScore(i, +val, `+${val} → ${S.teams[i].name}`);
  SFX.correct(); toast(T.toastAward(val, S.teams[i].name), 'okt');
  settleTile(i);
}
function missWager(){
  const val = S.q.wager.amount;
  applyScore(S.active, -val, `−${val} → ${S.teams[S.active].name}`);
  SFX.wrong(); toast(T.wagerLost(val), 'badt');
  settleTile(null);
}
function miss(i){
  const val = tileVal();
  applyScore(i, -val, `−${val} → ${S.teams[i].name}`);
  SFX.wrong(); toast(T.toastMiss(val, S.teams[i].name), 'badt');
  S.q.missed.push(i);
  if(S.cfg.steals && S.q.missed.length===1 && S.teams.length>1){ S.q.stealMode=true; }
  saveSnap(); render();
}
function firstMissToSteal(){ /* Classic Off: bez kary, otwarcie na przejęcie */
  pushHist(`Miss (no penalty) — steal open`);
  S.q.missed.push(S.active);
  S.q.stealMode = S.teams.length>1;
  SFX.wrong();
  if(!S.q.stealMode){ settleTile(null); return; }
  saveSnap(); render();
}
function steal(i){
  const val = tileVal();
  applyScore(i, +val, `Steal +${val} → ${S.teams[i].name}`);
  SFX.correct(); toast(T.toastAward(val, S.teams[i].name), 'okt');
  settleTile(i);
}
function stealMiss(i){
  /* nieudane przejęcie: bez kary, kolej na następną drużynę (konsultacja nr 2) */
  pushHist(`Steal missed — ${S.teams[i].name}`);
  S.q.missed.push(i); SFX.wrong();
  const left = S.teams.map((t,n)=>n).filter(n=>n!==S.active && !S.q.missed.includes(n));
  if(!left.length){ settleTile(null); return; }
  saveSnap(); render();
}
function noOne(){
  pushHist(T.noOne);
  settleTile(null);
}
function closeQuestion(){ /* przed odsłonięciem — kafel "podejrzany" (SPEC 4.5) */
  const {ci,ti} = S.q;
  if(S.cats[ci].tiles[ti].state==='idle') S.cats[ci].tiles[ti].state='peeked';
  S.q=null; stopTimer(); S.screen='board'; saveSnap(); render();
}

    body = `<div class="qcard" style="width:100%">
      <div class="qhead"><span class="cat">${esc(fin.category)}</span></div>
      <div class="qtext">${esc(fin.question)}</div>
      <div class="answrap"><div class="anstext">${esc(fin.answer)}</div>

        const j=F.judged[i], w=F.wagers[i];
        return `<div class="finalrow"><span class="fi"><span style="width:12px;height:12px;border-radius:50%;background:${TEAM_ACC[t.acc]}"></span>
          ${esc(t.name)} <span class="mut" style="font-size:13px">· wager ${w}</span></span>
          <span class="judge">
            <button class="${j===true?'okon':''}" data-fj="${i}" data-v="1">✓ ${j===true?`+${w}`:''}</button>
            <button class="${j===false?'badon':''}" data-fj="${i}" data-v="0">✗ ${j===false?`−${w}`:''}</button>
          </span></div>`;}).join('')}
      <div class="mactions">
        ${missing? `<span class="mut" style="font-size:13.5px;align-self:center">${T.needJudge(missing)}</span>`:''}
        <button class="btn btn-gold" data-act="fapply" ${missing?'disabled':''}>${T.applyResults}</button></div></div>`;
  }
  app.innerHTML = topbarHTML(T.finalTitle) +
    `<div id="stage"><div class="wizard"><div class="wsteps">${steps}</div>
    <h2 class="display goldtext" style="text-align:center;font-size:clamp(26px,4vw,44px);letter-spacing:.14em;margin-bottom:18px">${T.finalTitle}</h2>
    ${body}</div></div>` + teamrailHTML(false) + dockHTML();
  if(F.step===2 && F._timerRunning) startFinalTimer();
}
function finalTimerChip(){
  const F=S.final;
  const left = F._timerLeft!=null? F._timerLeft : 30;
  const sec = Math.ceil(left), C=2*Math.PI*28;
  return `<div class="timer ${sec===0?'done':sec<=5?'low':''}" data-act="ftimer" title="T">
    <svg width="64" height="64"><circle cx="32" cy="32" r="28" fill="none" stroke="rgba(175,182,203,.2)" stroke-width="4"/>
    <circle cx="32" cy="32" r="28" fill="none" stroke="${sec<=5?'var(--warm)':'var(--gold-flat)'}" stroke-width="4"
    stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-left/30)}"/></svg>
    <span class="tv">${sec===0?T.timeUp:(F._timerRunning?sec:'▶')}</span></div>`;
}
let fRAF=null,fLast=0;
function startFinalTimer(){
  if(fRAF) cancelAnimationFrame(fRAF); fLast=performance.now();
  const step=now=>{
    const F=S && S.final; if(!F || !F._timerRunning) return;
    F._timerLeft=Math.max(0,F._timerLeft-(now-fLast)/1000); fLast=now;
    const chip=document.querySelector('.timer'); if(chip) chip.outerHTML=finalTimerChip();
    if(F._timerLeft<=0){ F._timerRunning=false; SFX.gong(); return; }
    fRAF=requestAnimationFrame(step);
  };
  fRAF=requestAnimationFrame(step);
}
function finalNext(){
  const F=S.final;
  if(F.step===1){ pushHist(T.lockWagers); F.step=2; F._timerLeft=30; F._timerRunning=true; SFX.wager(); }
  else if(F.step===2){ F._timerRunning=false; F.step=3; SFX.reveal(); }
  else if(F.step===3){ F.step=4; }
  saveSnap(); render();
}
function finalApply(){
  const F=S.final;
  pushHist(T.applyResults);
  S.teams.forEach((t,i)=>{
    const w=F.wagers[i];
    t.score += F.judged[i] ? +w : -w;
    if(!S.cfg.classic && t.score<0) t.score=0;
  });
  const top = Math.max(...S.teams.map(t=>t.score));
  const leaders = S.teams.filter(t=>t.score===top);
  const tbs = gridPack().tiebreakers || [];
  if(leaders.length>1 && tbs.length && F.tbIdx < tbs.length){
    F.step=5; F.tie=leaders.map(l=>S.teams.indexOf(l));
    saveSnap(); render(); showTiebreak(); return;
  }
  finishToResults();
}
function showTiebreak(){
  const F=S.final, tb=gridPack().tiebreakers[F.tbIdx];

      ${F.tie.map(i=>`<div class="tchip okv" data-tbwin="${i}" style="--acc:${TEAM_ACC[S.teams[i].acc]}" role="button" tabindex="0">
        <span class="nm">${esc(S.teams[i].name)}</span><span class="pt">${T.tapWinner}</span></div>`).join('')}
    </div>`, false);
}
function tbWin(i){
  pushHist(`${T.tiebreaker} → ${S.teams[i].name}`);

/* ---------- S8 WYNIKI ---------- */
function renderResults(app){
  const order = S.teams.map((t,i)=>({...t,i})).sort((a,b)=>{
    if(b.score!==a.score) return b.score-a.score;
    if(S._tbWinner===a.i) return -1; if(S._tbWinner===b.i) return 1; return 0;
  });
  const champ = order[0];
  const maxScore = Math.max(1, ...order.map(o=>o.score));
  const cols = [order[1], order[0], order[2]].filter(Boolean);
  /* wysokość w px: miejsce na podium liczy się bardziej niż surowy wynik,
     ale wynik nadal wpływa na proporcję (SPEC 4.10) */
  const BASE = { 0: 1.0, 1: 0.78, 2: 0.6 };
  const heights = o => {
    const rank = order.indexOf(o);
    const byScore = maxScore>0 ? Math.max(0, o.score)/maxScore : 0;
    const f = Math.min(BASE[rank] ?? 0.5, 0.42 + 0.58*byScore * (BASE[rank] ?? 0.5)/1.0 + (rank===0?0.16:0));
    return Math.round(90 + 150*Math.max(0.18, Math.min(1, f)));
  };
  const confetti = document.body.classList.contains('reduce-motion') ? '' :
    `<div class="confetti">${Array.from({length:36},(_,i)=>
      `<i style="left:${(i*97)%100}%;animation-duration:${(3+((i*37)%20)/10).toFixed(1)}s;animation-delay:${((i*53)%18)/10}s;background:${['var(--g1)','var(--g2)','var(--g3)','var(--g5)'][i%4]}"></i>`).join('')}</div>`;
  app.innerHTML = topbarHTML(T.finalScores) + confetti +
  `<div id="stage"><div class="podiumwrap">
    <div class="champ">${T.champions} · ${esc(champ.name)}</div><div class="rule"></div>
    <div class="podium">${cols.map((o)=>{
      const rank = order.indexOf(o)+1;
      return `<div class="pcol ${rank===1?'first':''}" style="--acc:${TEAM_ACC[o.acc]}">
        ${rank===1?`<div class="crown">${markSVG(46)}</div>`:''}
        <div class="pbar" style="height:${heights(o)}px"><span class="r serifnum">${rank}</span></div>
        <div class="pname">${esc(o.name)}</div><div class="pscore">${o.score}</div></div>`;}).join('')}
    </div>
    <div class="finaltable">${order.map((o,r)=>`<div class="frow"><span>${r+1}. ${esc(o.name)}</span><b class="serifnum">${o.score}</b></div>`).join('')}</div>
    <div class="subrow">
      <button class="btn btn-gold" data-act="rematch">${T.rematch}</button>
      <button class="btn btn-quiet" data-act="newgame">${T.newGame}</button>
      <button class="btn btn-ghost" data-act="gohome">${T.home}</button>
    </div>
  </div></div>` + dockHTML();
}

/* ============ S11 — EDYTOR PAKIETU „THE BOARD SAYS" ============ */
function emptyBoardPack(){
  const rnd = () => ({ prompt:'', answers:[{text:'',points:30},{text:'',points:25},{text:'',points:20}] });
  return { id:newId(), formatVersion:1, kind:'larklock-pack', type:'match',
    title:'My Board Pack', language:'en', audience:'family-8plus', author:'', packVersion:'1.0',
    created:new Date().toISOString().slice(0,10), media:null, grid:null,
    match:{ rounds:[rnd(),rnd(),rnd(),rnd()], quickfire:[rnd(),rnd(),rnd(),rnd(),rnd()],
            tiebreaker:rnd() } };
}
function sumPill(sum){
  /* wyjaśniamy regułę, żeby kupujący nie zgadywał, po co ta matematyka (konsultacja nr 3) */
  const cls = sum>=95 && sum<=105 ? 'good' : (sum>=70 && sum<=110 ? 'okish' : 'warn');
  const txt = sum>=95 && sum<=105 ? `Adds up to ${sum} — perfect`
            : (sum>=70 && sum<=110 ? `Adds up to ${sum} — close enough`
            : `Adds up to ${sum} — totals near 100 feel fair`);
  return `<span class="sumpill ${cls}" title="${T.pointsHint}">${txt}</span><span class="sumhint">${T.pointsHint}</span>`;
}
function answerRows(list, base){
  return list.map((a,ai)=>`<div class="ansrow">
    <label class="fl grow">${T.answer} ${ai+1}<input data-ed="${base}.${ai}.text" maxlength="40" value="${esc(a.text||'')}"></label>
    <label class="fl pts">Points<input data-ed="${base}.${ai}.points" type="number" min="1" max="99" value="${esc(a.points)}"></label>
    ${list.length>3?`<button class="btn btn-ghost sm" data-act="delans" data-base="${base}" data-i="${ai}">✕</button>`:''}
  </div>`).join('') + (list.length<8?`<button class="btn btn-quiet sm" data-act="addans" data-base="${base}">+ Add answer</button>`:'');
}
function renderEditorMatch(app){
  const P=ED.pack, m=P.match;
  const tabs = m.rounds.map((r,i)=>`<button class="edtab ${ED.tab===i?'on':''}" data-edtab="${i}">${T.roundN(i+1)}</button>`).join('')
    + `<button class="edtab ${ED.tab==='qf'?'on':''}" data-edtab="qf">${T.quickfire}</button>`
    + `<button class="edtab ${ED.tab==='tb'?'on':''}" data-edtab="tb">${T.tiebreakTab}</button>`;
  let main='';
  if(ED.tab==='qf'){
    main = `<div class="panel"><h3>${T.quickfire}</h3>` + m.quickfire.map((q,i)=>`
      <div class="edblock"><label class="fl">Prompt ${i+1}<textarea data-ed="qf.${i}.prompt" maxlength="120" rows="2">${esc(q.prompt||'')}</textarea></label>
      ${answerRows(q.answers,'qf.'+i+'.answers')}${sumPill(q.answers.reduce((n,a)=>n+(+a.points||0),0))}</div>`).join('') + `</div>`;
  } else if(ED.tab==='tb'){
    const q=m.tiebreaker;
    main = `<div class="panel"><h3>${T.tiebreakTab}</h3>
      <label class="fl">Prompt<textarea data-ed="tbm.prompt" maxlength="160" rows="2">${esc(q.prompt||'')}</textarea></label>
      ${answerRows(q.answers,'tbm.answers')}${sumPill(q.answers.reduce((n,a)=>n+(+a.points||0),0))}</div>`;
  } else {
    const ri=ED.tab, r=m.rounds[ri];
    const sum=r.answers.reduce((n,a)=>n+(+a.points||0),0);
    main = `<div class="panel">
      <label class="fl">Prompt<textarea data-ed="rnd.${ri}.prompt" maxlength="160" rows="2" placeholder="Name something people do first thing in the morning.">${esc(r.prompt||'')}</textarea></label>
      ${answerRows(r.answers,'rnd.'+ri+'.answers')}
      ${sumPill(sum)}
      <div class="edcatactions">
        ${m.rounds.length<5?`<button class="btn btn-quiet sm" data-act="addround">+ Add round</button>`:''}
        ${m.rounds.length>3?`<button class="btn btn-ghost sm" data-act="delround" data-i="${ri}">Remove round</button>`:''}
      </div></div>`;
  }
  const v=validatePack(P);
  app.innerHTML = topbarHTML(T.studio,
    `<span class="chip" id="edstatus">${v.errors.length?T.issuesLeft(v.errors.length):(ED.dirty?'●':T.saved)}</span>
     <button class="btn btn-ghost" data-act="edback">${T.back}</button>`) +
  `<div id="stage"><div class="setup wide">
    <div class="edhead">
      <label class="fl grow">${T.packTitle}<input data-ed="title" maxlength="${LIMITS.title}" value="${esc(P.title)}"></label>
      <label class="fl">${T.audience}<select data-ed="audience">
        ${Object.entries(AUDIENCE).map(([k,val])=>`<option value="${k}" ${P.audience===k?'selected':''}>${val}</option>`).join('')}
      </select></label>
    </div>
    <div class="edtabs">${tabs}</div>
    ${main}
    <div class="errslot">${v.errors.length?`<div class="banner warn"><b>${T.issuesLeft(v.errors.length)}</b><br>${v.errors.slice(0,4).map(esc).join('<br>')}</div>`:''}</div>
    ${ED.savedOnce && ED.sinceExport>0 ? `<div class="banner">${T.savedHereOnly}</div>`:''}
    <div class="startwrap edbar">
      <button class="btn btn-gold" data-act="edsave" ${v.errors.length?'disabled':''}>${T.save}</button>
      <button class="btn btn-quiet" data-act="edexport">${T.exportFile}</button>
      <button class="btn btn-ghost" data-act="edcopy" title="${T.copyHint}">${T.copyText}</button>
      <button class="btn btn-quiet" data-act="edtest" ${v.errors.length?'disabled':''}>${T.testPlay}</button>
    </div>
  </div></div>`;
}
function edPath(base){
  /* zwraca tablicę odpowiedzi wskazaną ścieżką bazową */
  const m=ED.pack.match, s=base.split('.');
  if(s[0]==='rnd') return m.rounds[+s[1]].answers;
  if(s[0]==='qf') return m.quickfire[+s[1]].answers;
  if(s[0]==='tbm') return m.tiebreaker.answers;
  return null;
}

/* zapis pól edytora bez przerysowania (nie gubimy kursora) */
function edSet(path, value){
  const P = ED.pack, s = path.split('.');
  if(s[0]==='title'){ P.title = value; }
  else if(s[0]==='audience'){ P.audience = value; }
  else if(s[0]==='cat'){ P.grid.categories[+s[1]].name = value; }
  else if(s[0]==='tile'){ P.grid.categories[+s[1]].tiles[+s[2]][s[3]] = value; }
  else if(s[0]==='final'){ P.grid.final[s[1]] = value; }
  else if(s[0]==='tb'){ P.grid.tiebreakers[+s[1]][s[2]] = value; }
  else if(s[0]==='rnd'){ const r=P.match.rounds[+s[1]];
    if(s[2]==='prompt') r.prompt=value; else r.answers[+s[3]][s[4]] = s[4]==='points'?(parseInt(value,10)||0):value; }
  else if(s[0]==='qf'){ const q=P.match.quickfire[+s[1]];
    if(s[2]==='prompt') q.prompt=value; else q.answers[+s[3]][s[4]] = s[4]==='points'?(parseInt(value,10)||0):value; }
  else if(s[0]==='tbm'){ const q=P.match.tiebreaker;
    if(s[1]==='prompt') q.prompt=value; else q.answers[+s[2]][s[3]] = s[3]==='points'?(parseInt(value,10)||0):value; }
  ED.dirty = true; ED.sinceExport++;
  edRefreshStatus();
}
/* status, przyciski i lista błędów odświeżają się na bieżąco — bez przerysowania formularza,
   żeby nie gubić kursora (błąd wykryty testem: Save zostawał zablokowany po poprawieniu ostatniego pola) */
function edRefreshStatus(){
  if(!ED) return;
  const v = validatePack(ED.pack);
  const st = $('#edstatus');
  if(st) st.textContent = v.errors.length ? T.issuesLeft(v.errors.length) : (ED.dirty ? '●' : T.saved);
  ['edsave','edtest'].forEach(a=>{
    const b = document.querySelector(`[data-act="${a}"]`);
    if(b) b.disabled = v.errors.length>0;
  });
  const ban = document.querySelector('.errslot .banner.warn') || document.querySelector('.errslot');
  if(ban){
    const slot = document.querySelector('.errslot');
    if(slot){
      slot.innerHTML = v.errors.length
        ? `<div class="banner warn"><b>${T.issuesLeft(v.errors.length)}</b><br>${v.errors.slice(0,4).map(esc).join('<br>')}</div>` : '';
    }
  }
}
function edSave(){
  const v = validatePack(ED.pack);
  if(v.errors.length){ toast(T.issuesLeft(v.errors.length),'badt',1600); return; }
  const i = CUSTOM.findIndex(p=>p.id===ED.pack.id);
  if(i>=0) CUSTOM[i] = clone(ED.pack); else CUSTOM.push(clone(ED.pack));
  if(savePacks()){ ED.dirty=false; ED.savedOnce=true; toast(T.saved,'okt'); }
  else {
    /* pamięć przeglądarki odmówiła — użytkownik MUSI dowiedzieć się o tym wprost (konsultacja nr 3) */
    ED.storageFailed = true;
    showModal(`<h3 class="mt goldtext">${T.saveFailed}</h3><p>${T.saveFailedMsg}</p>
      <div class="mactions"><button class="btn btn-ghost" data-act="mcancel">${T.close}</button>
      <button class="btn btn-gold" data-act="edexport">${T.exportFile}</button></div>`);
  }
  render();
}
function edLeave(){
  if(ED && ED.dirty && ED.sinceExport>0){
    confirmModal(T.unsaved, T.downloadBackup, ()=>{ exportPack(ED.pack); ED=null; SHELL.screen='s9'; render(); });
    const ovl=$('#ovl'); if(ovl){ const c=ovl.querySelector('[data-act="mcancel"]'); if(c) c.textContent=T.later;
      c.addEventListener('click',()=>{ ED=null; SHELL.screen='s9'; render(); }); }
    return;
  }
  ED=null; SHELL.screen='s9'; render();
}
let PENDING_IMPORT = null;
function importFlow(){ pickFile(acceptImport); }
function pasteFlow(){
  showModal(`<h3 class="mt goldtext">${T.pasteTitle}</h3><p>${T.pasteHelp}</p>
    <textarea id="pastetext" style="width:100%;height:170px;background:#0B1222;color:var(--paper);border:1px solid rgba(201,162,76,.4);border-radius:10px;padding:12px;font-family:monospace;font-size:12px;user-select:text;-webkit-user-select:text"></textarea>
    <div class="mactions"><button class="btn btn-ghost" data-act="mcancel">${T.cancel}</button>
    <button class="btn btn-gold" data-act="dopaste">${T.pasteBtn}</button></div>`);
}
function acceptPasted(){
  const ta=document.getElementById('pastetext'); if(!ta) return;
  let obj=null; try{ obj=JSON.parse(ta.value); }catch(e){ obj=null; }
  closeModal(); acceptImport(obj);
}
function acceptImport(obj){
  (function(){
    if(!obj){ showModal(`<h3 class="mt goldtext">${T.importFail}</h3><p>${T.importFailMsg}</p>
      <div class="mactions"><button class="btn btn-gold" data-act="mcancel">${T.close}</button></div>`); return; }
    const v = validatePack(obj);
    if(v.errors.length){
      showModal(`<h3 class="mt goldtext">${T.importFail}</h3>
        ${v.errors.slice(0,6).map(e=>`<p>${esc(e)}</p>`).join('')}
        <div class="mactions"><button class="btn btn-gold" data-act="mcancel">${T.close}</button></div>`); return;
    }
    const add = ()=>{ const p=clone(obj); p.id=newId(); CUSTOM.push(p); savePacks(); closeModal();
      toast(T.importedOk(p.title, countQuestions(p)),'okt',1800); render(); };
    if(v.warnings.length){
      showModal(`<h3 class="mt goldtext">${T.importWarn}</h3>
        ${v.warnings.slice(0,5).map(w=>`<p>${esc(w)}</p>`).join('')}
        <div class="mactions"><button class="btn btn-ghost" data-act="mcancel">${T.cancelImport}</button>
        <button class="btn btn-gold" data-act="doimport">${T.importAnyway}</button></div>`);
      PENDING_IMPORT = add;
    } else add();
  })();
}

/* ---------- MODALE ---------- */
function showModal(inner, dismissable=true){
  closeModal();
  const d=document.createElement('div'); d.className='overlay'; d.id='ovl';
  d.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${inner}</div>`;
  if(dismissable) d.addEventListener('click', e=>{ if(e.target===d) closeModal(); });
  document.body.appendChild(d);
}
function closeModal(){ const o=$('#ovl'); if(o) o.remove(); }
function confirmModal(text, okLabel, onOk, danger=false){
  showModal(`<p style="color:var(--paper);font-size:16.5px">${esc(text)}</p>
    <div class="mactions"><button class="btn btn-ghost" data-act="mcancel">${T.cancel}</button>
    <button class="btn ${danger?'btn-danger':'btn-gold'}" data-act="mok">${esc(okLabel)}</button></div>`);
  $('#ovl [data-act="mok"]').addEventListener('click', ()=>{ closeModal(); onOk(); });
  $('#ovl [data-act="mcancel"]').addEventListener('click', closeModal);
}

/* ============ ZDARZENIA ============ */
/* WSZYSTKIE atrybuty obsługiwane przez delegację kliknięć. Element z atrybutem spoza tej
   listy jest martwy — dlatego test „klikalności" (test-wiring) pilnuje jej kompletności. */
const ACT_ATTRS = ["data-act","data-team","data-ci","data-award","data-miss","data-steal","data-stealmiss",
  "data-seg","data-set","data-fw","data-fj","data-misswager","data-tbwin","data-pickpack","data-edtab",
  "data-packid","data-slot","data-foteam","data-stealteam","data-qfrow","data-qfpick",
  "data-pickhost","data-compitem"];
const ACT_SEL = ACT_ATTRS.map(a=>'['+a+']').join(',');
window.__ACT_ATTRS = ACT_ATTRS;
function bindGlobal(){ /* delegacja jest globalna (dokument), bo popovery i modale żyją poza #app */ }
document.addEventListener('pointerdown', ()=>{ audioResume(); }, {capture:true});
document.addEventListener('click', e=>{
  const el = e.target.closest(ACT_SEL);
  if(!el) return;
  handleAction(el, e);
});
document.addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.matches && e.target.matches('.tile,.tchip,.team,.modecard,.packcard')){
    e.preventDefault(); e.target.click();
  }
});
document.addEventListener('input', e=>{
  const tn = e.target.getAttribute && e.target.getAttribute('data-tn');
  if(tn!=null && SHELL.setup){ SHELL.setup.teams[+tn]=e.target.value; return; }
  const ed = e.target.getAttribute && e.target.getAttribute('data-ed');
  if(ed!=null && ED){ edSet(ed, e.target.value); }
});
document.addEventListener('change', e=>{
  const ed = e.target.getAttribute && e.target.getAttribute('data-ed');
  if(ed!=null && ED && e.target.tagName==='SELECT'){ edSet(ed, e.target.value); }
});
function handleAction(el){
  const act = el.getAttribute('data-act');
  /* setup */
  if(el.hasAttribute('data-seg')){
    const name=el.getAttribute('data-seg'); let v=el.getAttribute('data-val');
    if(v==='true')v=true; else if(v==='false')v=false; else v=+v;
    SHELL.setup[name]=v; renderShell($('#app')); bindGlobal(); return;
  }
  if(el.hasAttribute('data-team')){ if(S && S.screen==='board'){ pushHist(`Active → ${S.teams[+el.getAttribute('data-team')].name}`); S.active=+el.getAttribute('data-team'); saveSnap(); render(); } return; }
  if(el.hasAttribute('data-ci')){ openTile(+el.getAttribute('data-ci'), +el.getAttribute('data-ti')); return; }
  if(el.hasAttribute('data-award')){ award(+el.getAttribute('data-award')); return; }
  if(el.hasAttribute('data-misswager')){ missWager(); return; }
  if(el.hasAttribute('data-miss')){ miss(+el.getAttribute('data-miss')); return; }
  if(el.hasAttribute('data-steal')){ steal(+el.getAttribute('data-steal')); return; }
  if(el.hasAttribute('data-stealmiss')){ stealMiss(+el.getAttribute('data-stealmiss')); return; }
  if(el.hasAttribute('data-fw')){
    const i=+el.getAttribute('data-fw'), d=+el.getAttribute('data-d');
    const F=S.final, mx=Math.max(S.teams[i].score,500);
    F.wagers[i]=Math.min(mx, Math.max(0, F.wagers[i]+d*100));
    saveSnap(); render(); return;
  }
  if(el.hasAttribute('data-fj')){
    S.final.judged[+el.getAttribute('data-fj')] = el.getAttribute('data-v')==='1';
    saveSnap(); render(); return;
  }
  if(el.hasAttribute('data-tbwin')){ tbWin(+el.getAttribute('data-tbwin')); return; }
  if(el.hasAttribute('data-set')){
    const n=el.getAttribute('data-set'); let v=el.getAttribute('data-val');
    if(v==='true') v=true; else if(v==='false') v=false;
    if(n==='theme') applyTheme(v);
    if(n==='tvboost') applyTextSize(v);
    if(n==='motion') applyMotion(v);
    if(n==='mute'){ UI.muted=v; setVol(); }
    render(); return;
  }
  if(el.hasAttribute('data-pickpack')){ SHELL.setup.packId = el.getAttribute('data-pickpack'); render(); return; }
  if(el.hasAttribute('data-pickhost')){ HOSTPACK = el.getAttribute('data-pickhost'); COMP.idx=-1; render(); return; }
  if(el.hasAttribute('data-compitem')){ COMP.idx = +el.getAttribute('data-compitem'); render(); return; }
  if(el.hasAttribute('data-edtab')){ const v=el.getAttribute('data-edtab'); ED.tab = (v==='final'||v==='tb')?v:+v; render(); return; }
  if(el.hasAttribute('data-slot')){ bTapSlot(+el.getAttribute('data-slot')); return; }
  if(el.hasAttribute('data-foteam')){ const i=+el.getAttribute('data-foteam');
    pushHist('Face-off buzz'); S.r.fo.first=i; S.r.fo.step='first'; saveSnap(); render(); return; }
  if(el.hasAttribute('data-stealteam')){ const i=+el.getAttribute('data-stealteam');
    pushHist('Steal chance'); S.r.stealTeam=i; S.r.phase='stealpick'; saveSnap(); render(); return; }
  if(el.hasAttribute('data-qfrow')){ qfPickRow(+el.getAttribute('data-qfrow')); return; }
  if(el.hasAttribute('data-qfpick')){ qfSetPick(+el.getAttribute('data-qfpick'), +el.getAttribute('data-ai')); return; }
  switch(act){
    case 'goboard': SHELL.screen='s2'; SHELL.setup=defaultSetup('match'); render(); break;
    case 'showprompt': pushHist('Show prompt'); S.r.phase = (S.cfg.faceoff && S.teams.length>1) ? 'faceoff' : 'play';
      if(S.r.phase==='play'){ S.r.playing = S.active; } SFX.reveal(); saveSnap(); render(); break;
    case 'fostrike': faceoffStrike(); break;
    case 'foplay': pushHist('Play'); S.r.playing=S.r.r_choice; S.r.phase='play'; saveSnap(); render(); break;
    case 'fopass': { pushHist('Pass'); const others=S.teams.map((t,i)=>i).filter(i=>i!==S.r.r_choice);
      S.r.playing = others[0]; S.r.phase='play'; saveSnap(); render(); break; }
    case 'strike': bStrike(); break;
    case 'stealfail': pushHist('Steal failed'); SFX.wrong(); awardBank(S.r.playing); break;
    case 'flipall': pushHist('Flip the rest'); S.r.slots.forEach((s,i)=>{ if(!s.revealed) revealSlot(i,false); }); saveSnap(); render(); break;
    case 'bnext': bNextRound(); break;
    case 'qfstart': case 'qfnextp': case 'qfdone': qfAdvance(); break;
    case 'qfsolo': S.qf.solo = !S.qf.solo; saveSnap(); render(); break;
    case 'qfout': closeModal(); boardFinish(); break;
    case 'gogrid': SHELL.screen='s2'; SHELL.setup=defaultSetup('grid'); render(); break;
    case 'backhome': SHELL.screen='s1'; render(); break;
    case 'tplus': SHELL.setup.teamsCount=Math.min(6,SHELL.setup.teamsCount+1); render(); break;
    case 'tminus': SHELL.setup.teamsCount=Math.max(1,SHELL.setup.teamsCount-1); render(); break;
    case 'startgame': startGame(); break;
    case 'resume': { const s=loadSnap(); if(s && !s.__broken){ S=s; HIST=[]; render(); } break; }
    case 'discardsave': confirmModal(T.discardQ, T.discard, ()=>{ clearSnap(); render(); }, true); break;
    case 'studio': SHELL.screen='s9'; render(); break;
    case 'help': showInfo(act); break;
    case 'hostkit': COMP.idx=-1; SHELL.screen='s13'; render(); break;
    case 'companion': COMP.idx=-1; SHELL.screen='s14'; render(); break;
    case 'printsheet': printHostSheet(); break;
    case 'pastepack': pasteFlow(); break;
    case 'dopaste': acceptPasted(); break;
    case 'hidekey': COMP.hidden=!COMP.hidden; render(); break;
    case 'compprev': COMP.idx=Math.max(0, COMP.idx-1); render(); break;
    case 'compnext': { const n=compItems(hostPack()).length; COMP.idx=Math.min(n-1, COMP.idx+1); render(); break; }
    case 'reveal': if(S.q && !S.q.revealed){ pushHist(`${T.reveal}`); S.q.revealed=true; stopTimer(false); S.q._timerRunning=false; SFX.reveal(); saveSnap(); render(); } break;
    case 'closeq': closeQuestion(); break;
    case 'noone': noOne(); break;
    case 'firstmiss': firstMissToSteal(); break;
    case 'timer': toggleTimer(); break;
    case 'ftimer': { const F=S.final; if(F._timerLeft===0){F._timerLeft=30;F._timerRunning=false;} else {F._timerRunning=!F._timerRunning; if(F._timerRunning) startFinalTimer();} render(); break; }
    case 'wminus': S.q.wager.amount=Math.max(100,S.q.wager.amount-100); render(); break;
    case 'wplus': S.q.wager.amount=Math.min(wagerMax(),S.q.wager.amount+100); render(); break;
    case 'wlock': pushHist(`${T.wagerTitle} ${S.q.wager.amount}`); S.q.wager.locked=true; S.screen='question'; saveSnap(); render(); break;
    case 'flock': finalNext(); break;
    case 'fnext': finalNext(); break;
    case 'fapply': finalApply(); break;
    case 'roundnext': roundNext(); break;
    case 'rematch': { clearSnap(); const names=S.teams.map(t=>t.name); const cfg=S.cfg; const pk=S.pack;
      S=freshMatch({teams:names,pack:pk,rounds:cfg.rounds,wagers:cfg.wagers,classic:cfg.classic,steals:cfg.steals,timerSec:cfg.timerSec,finalOn:cfg.finalOn});
      HIST=[]; saveSnap(); render(); break; }
    case 'newgame': S=null; HIST=[]; clearSnap(); SHELL.screen='s2'; render(); break;
    case 'gohome': S=null; HIST=[]; clearSnap(); SHELL.screen='s1'; render(); break;
    case 'undo': undo(); break;
    case 'hist': UI.histPop=!UI.histPop; UI.volPop=false; UI.menuPop=false; rerenderPops(); break;
    case 'sound': UI.volPop=!UI.volPop; UI.histPop=false; UI.menuPop=false; rerenderPops(); break;
    case 'mute': UI.muted=!UI.muted; setVol(); syncDockIcons(); rerenderPops(); break;
    case 'menu': UI.menuPop=!UI.menuPop; UI.volPop=false; UI.histPop=false; rerenderPops(); break;
    case 'fs': toggleFS(); UI.menuPop=false; rerenderPops(); break;
    case 'endround': UI.menuPop=false; rerenderPops();
      confirmModal(T.endRoundQ, T.endRound, ()=>{ pushHist(T.endRound);
        S.cats.forEach(c=>c.tiles.forEach(t=>{ if(t.state!=='played') t.state='played'; }));
        S.q=null; stopTimer(); S.screen='board';
        saveSnap(); render(); }); break;
    case 'exit': UI.menuPop=false; rerenderPops();
      confirmModal(T.exitQ, T.leave, ()=>{ S=null; HIST=[]; clearSnap(); SHELL.screen='s1'; stopTimer(); render(); }, true); break;
    case 'tbreveal': { const a=$('#tbans'); if(a) a.style.display='block'; SFX.reveal(); break; }
    case 'settings': SHELL.screen='s12'; render(); break;
    case 'resetall': confirmModal(T.resetConfirm, T.resetAll, ()=>{
        CUSTOM=[]; try{ localStorage.clear(); }catch(e){}
        applyTheme('classic'); applyTextSize(false); applyMotion(false);
        UI.vol=0.8; UI.muted=false; setVol(); SHELL.screen='s1'; render();
      }, true); break;
    case 'newpack': showModal(`<h3 class="mt goldtext">${T.newPack}</h3><p>${T.pickType}</p>
        <div class="mactions" style="justify-content:center">
        <button class="btn btn-gold" data-act="newgrid">${T.playGrid}</button>
        <button class="btn btn-gold" data-act="newboard">${T.playBoard}</button></div>`); break;
    case 'newgrid': closeModal(); openEditor(emptyGridPack()); break;
    case 'newboard': closeModal(); openEditor(emptyBoardPack()); break;
    case 'addans': { const arr=edPath(el.getAttribute('data-base')); if(arr && arr.length<8){ arr.push({text:'',points:5}); ED.dirty=true; render(); } break; }
    case 'delans': { const arr=edPath(el.getAttribute('data-base')); if(arr && arr.length>3){ arr.splice(+el.getAttribute('data-i'),1); ED.dirty=true; render(); } break; }
    case 'addround': { ED.pack.match.rounds.push({prompt:'',answers:[{text:'',points:30},{text:'',points:25},{text:'',points:20}]});
      ED.tab=ED.pack.match.rounds.length-1; ED.dirty=true; render(); break; }
    case 'delround': { ED.pack.match.rounds.splice(+el.getAttribute('data-i'),1); ED.tab=0; ED.dirty=true; render(); break; }
    case 'importpack': importFlow(); break;
    case 'dupe': { const src=packById(el.getAttribute('data-packid')); if(!src) break;
      const cp=clone(src); cp.id=newId();
      let base=(src.title+' (copy)').slice(0,LIMITS.title), n=2, title=base;
      while(allPacks().some(x=>x.title===title)){ title=(src.title+` (copy ${n++})`).slice(0,LIMITS.title); }
      cp.title=title; openEditor(cp); break; }
    case 'editpack': { const pk=packById(el.getAttribute('data-packid')); if(pk) openEditor(pk); break; }
    case 'exportpack': { const pk=packById(el.getAttribute('data-packid')); if(pk) exportPack(pk); break; }
    case 'delpack': { const pk=packById(el.getAttribute('data-packid')); if(!pk) break;
      confirmModal(T.deleteQ(pk.title), T.del, ()=>{ CUSTOM=CUSTOM.filter(x=>x.id!==pk.id); savePacks(); render(); }, true); break; }
    case 'backup': { downloadJSON({kind:'larklock-backup',formatVersion:1,packs:CUSTOM}, 'larklock-packs-backup.json') || copyFallback(CUSTOM); break; }
    case 'edsave': edSave(); break;
    case 'edexport': {
      /* eksport zapisuje też pakiet w bibliotece — inaczej plik i biblioteka się rozjeżdżają */
      if(!validatePack(ED.pack).errors.length){
        const i=CUSTOM.findIndex(x=>x.id===ED.pack.id);
        if(i>=0) CUSTOM[i]=clone(ED.pack); else CUSTOM.push(clone(ED.pack));
        savePacks(); ED.dirty=false; ED.savedOnce=true;
      }
      /* najpierw sprzątamy ekran, DOPIERO potem eksport — inaczej zamykamy okno
         z pytaniami do skopiowania, które otwiera się, gdy pobieranie jest zablokowane */
      ED.sinceExport=0; closeModal(); render(); exportPack(ED.pack); break; }
    case 'edcopy': { const d=clone(ED.pack); delete d.id; copyFallback(d); ED.sinceExport=0; break; }
    case 'edback': edLeave(); break;
    case 'edtest': { const pk=clone(ED.pack); if(!packById(pk.id)) CUSTOM.push(pk);
      SHELL.setup=defaultSetup(pk.type==='match'?'match':'grid'); SHELL.setup.packId=pk.id;
      SHELL.screen='s2'; render(); break; }
    case 'addcat': { ED.pack.grid.categories.push({name:'',tiles:[100,200,300,400,500].map(v=>({value:v,question:'',answer:''}))});
      ED.tab=ED.pack.grid.categories.length-1; ED.dirty=true; render(); break; }
    case 'delcat': { const i=+el.getAttribute('data-i'); ED.pack.grid.categories.splice(i,1);
      ED.tab=Math.max(0,i-1); ED.dirty=true; render(); break; }
    case 'addtb': { ED.pack.grid.tiebreakers.push({question:'',answer:''}); ED.dirty=true; render(); break; }
    case 'deltb': { ED.pack.grid.tiebreakers.splice(+el.getAttribute('data-i'),1); ED.dirty=true; render(); break; }
    case 'doimport': if(PENDING_IMPORT){ const f=PENDING_IMPORT; PENDING_IMPORT=null; f(); } break;
    case 'copytext': { const ta=$('#packtext'); if(ta){ ta.select(); try{ document.execCommand('copy'); toast(T.saved,'okt'); }catch(e){} } break; }
    case 'tbnext': { S.final.tbIdx++; saveSnap(); closeModal(); showTiebreak(); break; }
    case 'mcancel': case 'mcancel2': closeModal(); break;
  }
}
function showInfo(which){
  if(which==='studio'){
    showModal(`<h3 class="mt goldtext">${T.studio}</h3><p>${T.soonStudio}</p>
      <div class="mactions"><button class="btn btn-gold" data-act="mcancel2">${T.close}</button></div>`);

      ${T.hostSteps.map(s=>`<li>${s}</li>`).join('')}</ol>
      <p style="margin-top:12px;font-size:13.5px">${T.hostKeys}</p>

function startGame(){
  const c=SHELL.setup;
  const names=c.teams.slice(0,c.teamsCount).map(s=>s.trim());
  const bad=names.findIndex(n=>!n);
  if(bad>=0){ toast(T.needName,'badt',1800); return; }
  const isGrid = c.mode!=='match';
  const pack = packById(c.packId) || (isGrid?FACTORY_GRID:FACTORY_BOARD);
  const v = validatePack(pack);
  if(v.errors.length){ toast(T.issuesLeft(v.errors.length),'badt',1800); return; }
  if(isGrid) S=freshMatch({teams:names,pack,rounds:c.rounds,wagers:c.wagers,classic:c.classic,steals:c.steals,timerSec:c.timerSec,finalOn:c.finalOn});
  else { S=freshBoardMatch({teams:names,pack,rounds:c.rounds,faceoff:c.faceoff,quickfire:c.quickfire,qfTarget:c.qfTarget}); startRoundBoard(); }
  HIST=[]; saveSnap(); render();
}
function toggleFS(){
  try{
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }catch(e){}
}

/* klawiatura globalna (SPEC 10.4) */
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea')) return;
  const k=e.key.toLowerCase();
  if(k==='m'){ UI.muted=!UI.muted; setVol(); syncDockIcons(); return; }
  if(k==='f'){ toggleFS(); return; }
  if(k==='u'){ if(S) undo(); return; }
  if(k==='t'){ if(S && S.screen==='question') toggleTimer(); return; }
  if(k==='escape'){
    if($('#ovl')){ closeModal(); return; }
    if(UI.volPop||UI.histPop||UI.menuPop){ UI.volPop=UI.histPop=UI.menuPop=false; rerenderPops(); return; }
    if(S && S.screen==='question' && !S.q.revealed){ closeQuestion(); return; }
    if(!S && SHELL.screen==='s10'){ edLeave(); return; }
    if(!S && SHELL.screen==='s14'){ if(COMP.idx>=0){ COMP.idx=-1; } else { SHELL.screen='s13'; } render(); return; }
    if(!S && SHELL.screen==='s13'){ SHELL.screen='s1'; render(); return; }
    if(!S && (SHELL.screen==='s2'||SHELL.screen==='s9'||SHELL.screen==='s12')){ SHELL.screen='s1'; render(); return; }
    return;
  }
  if(k===' '){ 
    if(!S && SHELL.screen==='s0'){ return; }
    if(S && S.screen==='question' && !S.q.revealed){ e.preventDefault(); handleAction(Object.assign(document.createElement('b'),{getAttribute:a=>a==='data-act'?'reveal':null,hasAttribute:()=>false})); return; }
    return;
  }
  if(/^[1-6]$/.test(k)){
    const i=+k-1; if(!S || i>=S.teams.length) return;
    if(S.screen==='question' && S.q && S.q.revealed){
      if(S.q.wager){ if(i===S.active) award(i); return; }
      if(S.q.stealMode){ if(i!==S.active && !S.q.missed.includes(i)) steal(i); return; }
      if(e.shiftKey && S.cfg.classic){ if(!S.q.missed.includes(i)) miss(i); return; }
      award(i); return;
    }
    if(S.screen==='board'){ pushHist(`Active → ${S.teams[i].name}`); S.active=i; saveSnap(); render(); }
  }
});
window.addEventListener('beforeunload', e=>{
  if(S && S.screen!=='results'){ e.preventDefault(); e.returnValue=''; }
});


/* ============ S13/S14 — HOST KIT: klucz odpowiedzi dla prowadzącego ============
   Powód istnienia (SPEC M8, 4.4, 4.15): w THE BOARD SAYS odpowiedzi są ukryte
   przed WSZYSTKIMI — także przed prowadzącym. Bez klucza rundy nie da się
   poprowadzić. Rozwiązanie zgodne z regułą „jeden ekran”: wydruk albo telefon. */
let HOSTPACK = null;
let COMP = { idx: -1, hidden: false };

function bigScreen(){ return Math.min(window.innerWidth, window.innerHeight) >= 700 || window.innerWidth >= 900; }
function hostPack(){
  const p = HOSTPACK && packById(HOSTPACK);
  return p || allPacks('match')[0] || allPacks()[0] || FACTORY_GRID;
}
function renderHostKit(app){
  const cur = hostPack();
  HOSTPACK = cur.id;
  app.innerHTML = topbarHTML(T.hostKit, `<button class="btn btn-ghost" data-act="backhome">${T.back}</button>`) +
  `<div id="stage"><div class="setup">

    <p class="hkintro">${T.hostKitSub}</p>
    <div class="panel"><h3>${T.chooseP}</h3>
      <div class="packrow">${allPacks().map(pk=>`
        <div class="packcard ${cur.id===pk.id?'sel':''} focusable" tabindex="0" role="button" data-pickhost="${esc(pk.id)}">
          <div class="t">${esc(pk.title)}</div>
          <div class="m">${pk.type==='grid'?T.playGrid:T.playBoard}${isFactory(pk)?'':' · Custom'}<br>${countQuestions(pk)} ${T.questionsN}</div>
        </div>`).join('')}</div>
      <div class="hkimport">
        <button class="btn btn-quiet" data-act="importpack">${T.importPack}</button>
        <button class="btn btn-quiet" data-act="pastepack">${T.pastePack}</button>

    </div>
    <div class="panel"><h3>${T.answersFor}</h3>
      <div class="hkacts">
        ${bigScreen()?`<button class="btn btn-gold" data-act="printsheet">${T.printSheet}</button>`:''}
        <button class="btn ${bigScreen()?'btn-quiet':'btn-gold'}" data-act="companion">${T.openCompanion}</button>
      </div>
      ${bigScreen()
        ? `<p class="hkhint"><b>${T.printSheet}</b> — ${T.hostSheetHint}</p>`
        : `<p class="hkhint">${T.printMobile}</p>`}
      <p class="hkhint"><b>${T.openCompanion}</b> — ${T.companionHint}</p>
      <p class="hkhint hktwo">${T.twoScreens}</p>
    </div>
  </div></div>`;
}

/* ---------- arkusz do druku (window.print, bez okien wyskakujących) ---------- */
function sheetTable(rows){
  return `<table class="ps-t">${rows}</table>`;
}
function hostSheetHTML(p){
  const kind = p.type==='grid' ? T.playGrid : T.playBoard;
  const head = `<div class="ps-head">
      <div class="ps-brand">LARKLOCK · QUIZ SHOW</div>
      <h1>${esc(p.title)}</h1>
      <div class="ps-sub">${kind} · ${T.answersFor}</div>
      <div class="ps-eyes">${T.hostEyes}</div>
    </div>`;
  const foot = `<div class="ps-foot">${T.sheetFoot}</div>`;
  let body = '';
  if(p.type === 'grid'){
    body += (p.grid.categories||[]).map(c=>`<section class="ps-blk"><h2>${esc(c.name)}</h2>${
      sheetTable((c.tiles||[]).map(t=>`<tr><td class="v">${t.value}</td><td class="q">${esc(t.question)}</td><td class="a">${esc(t.answer)}</td></tr>`).join(''))
    }</section>`).join('');
    if(p.grid.final) body += `<section class="ps-blk"><h2>${T.finalTitle}${p.grid.final.category?' · '+esc(p.grid.final.category):''}</h2>${
      sheetTable(`<tr><td class="v">★</td><td class="q">${esc(p.grid.final.question)}</td><td class="a">${esc(p.grid.final.answer)}</td></tr>`)}</section>`;
    if((p.grid.tiebreakers||[]).length) body += `<section class="ps-blk"><h2>${T.tiebreaker}</h2>${
      sheetTable(p.grid.tiebreakers.map((t,i)=>`<tr><td class="v">${i+1}</td><td class="q">${esc(t.question)}</td><td class="a">${esc(t.answer)}</td></tr>`).join(''))}</section>`;
  } else {
    body += `<p class="ps-note">${T.sheetSlotNote}</p><p class="ps-note">${T.sheetMultNote}</p>`;
    body += (p.match.rounds||[]).map((r,i)=>`<section class="ps-blk"><h2>${T.roundN(i+1)}
      <span class="ps-strikes">${T.strikesLbl} <i></i><i></i><i></i></span></h2>
      <p class="ps-prompt">${esc(r.prompt)}</p>${
      sheetTable((r.answers||[]).map((a,j)=>`<tr><td class="v">${j+1}</td><td class="q">${esc(a.text)}</td><td class="a">${a.points}</td><td class="n"></td></tr>`).join(''))
    }</section>`).join('');
    if((p.match.quickfire||[]).length) body += `<section class="ps-blk qf"><h2>${T.quickfire}
      <span class="ps-strikes">${T.sheetTargetNote}</span></h2>
      <div class="ps-qf">${p.match.quickfire.map((r,i)=>`<div class="ps-qi"><p class="ps-prompt">${i+1}. ${esc(r.prompt)}</p>${
        sheetTable((r.answers||[]).map(a=>`<tr><td class="q">${esc(a.text)}</td><td class="a">${a.points}</td></tr>`).join(''))}</div>`).join('')}</div>
    </section>`;
    if(p.match.tiebreaker) body += `<section class="ps-blk"><h2>${T.tiebreaker}</h2>
      <p class="ps-prompt">${esc(p.match.tiebreaker.prompt)}</p>${
      sheetTable((p.match.tiebreaker.answers||[]).map((a,j)=>`<tr><td class="v">${j+1}</td><td class="q">${esc(a.text)}</td><td class="a">${a.points}</td></tr>`).join(''))}</section>`;
  }
  return head + body + foot;
}
function buildSheet(){
  let el = document.getElementById('printsheet');
  if(!el){ el = document.createElement('div'); el.id = 'printsheet'; document.body.appendChild(el); }
  el.innerHTML = hostSheetHTML(hostPack());
  return el;
}
function printHostSheet(){
  buildSheet();
  /* Fonty są wbudowane, ale przeglądarka dekoduje je dopiero przy pierwszym użyciu.
     Wywołanie print() zanim to się skończy drukuje puste miejsca zamiast liter
     (font-display:block). Czekamy na gotowość fontów — z twardym limitem czasu. */
  let fired = false;
  const go = ()=>{ if(fired) return; fired = true;
    try{ window.print(); }catch(e){ toast(T.printFail, 'badt', 3000); } };
  setTimeout(go, 1200);
  if(document.fonts && document.fonts.ready && document.fonts.ready.then){
    document.fonts.ready.then(()=>setTimeout(go, 50)).catch(go);
  } else setTimeout(go, 150);
}
window.addEventListener('beforeprint', ()=>{
  const el = document.getElementById('printsheet');
  if(!el || !el.innerHTML) buildSheet();
});

/* ---------- S14 — HOST COMPANION (ten sam klucz, na telefonie) ---------- */
function compItems(p){
  const out = [];
  if(p.type === 'grid'){
    (p.grid.categories||[]).forEach(c=> out.push({ title:c.name, sub:`${(c.tiles||[]).length} ${T.questionsN}`,
      rows:(c.tiles||[]).map(t=>({ n:t.value, text:t.question, pts:t.answer })) }));
    if(p.grid.final) out.push({ title:T.finalTitle, sub:p.grid.final.category||'',
      rows:[{ n:'★', text:p.grid.final.question, pts:p.grid.final.answer }] });
    if((p.grid.tiebreakers||[]).length) out.push({ title:T.tiebreaker, sub:`${p.grid.tiebreakers.length} ${T.questionsN}`,
      rows:p.grid.tiebreakers.map((t,i)=>({ n:i+1, text:t.question, pts:t.answer })) });
  } else {
    (p.match.rounds||[]).forEach((r,i)=> out.push({ title:T.roundN(i+1), sub:r.prompt, prompt:r.prompt,
      rows:(r.answers||[]).map((a,j)=>({ n:j+1, text:a.text, pts:a.points })) }));
    (p.match.quickfire||[]).forEach((r,i)=> out.push({ title:`${T.quickfire} ${i+1}`, sub:r.prompt, prompt:r.prompt,
      rows:(r.answers||[]).map((a,j)=>({ n:j+1, text:a.text, pts:a.points })) }));
    if(p.match.tiebreaker) out.push({ title:T.tiebreaker, sub:p.match.tiebreaker.prompt, prompt:p.match.tiebreaker.prompt,
      rows:(p.match.tiebreaker.answers||[]).map((a,j)=>({ n:j+1, text:a.text, pts:a.points })) });
  }
  return out;
}
function renderCompanion(app){
  const p = hostPack(), items = compItems(p);
  const warn = `<div class="compwarn">${T.companionWarn}</div>`;
  if(COMP.idx < 0 || !items[COMP.idx]){
    app.innerHTML = topbarHTML(T.companion, `<button class="btn btn-ghost" data-act="hostkit">${T.back}</button>`) +
    `<div id="stage"><div class="compwrap">${warn}
      <div class="cptitle">${esc(p.title)}</div>
      <div class="cplist">${items.map((it,i)=>`
        <div class="cpitem focusable" tabindex="0" role="button" data-compitem="${i}">
          <span class="cn">${esc(it.title)}</span><span class="cs">${esc(it.sub||'')}</span></div>`).join('')}</div>
      <p class="cphint">${T.companionHint}</p>
    </div></div>`;
    return;
  }
  const it = items[COMP.idx];
  app.innerHTML = topbarHTML(T.companion, `<button class="btn btn-ghost" data-compitem="-1">${T.back}</button>`) +
  `<div id="stage"><div class="compwrap">${warn}
    <div class="cphead"><span class="ck">${esc(it.title)}</span><span class="cx">${T.ofN(COMP.idx+1, items.length)}</span></div>
    ${it.prompt?`<p class="cpprompt">${esc(it.prompt)}</p>`:''}
    <div class="cptoggle"><button class="btn btn-quiet sm" data-act="hidekey">${COMP.hidden?T.showKey:T.hideKey}</button></div>
    <div class="cprows">${it.rows.map(r=>`<div class="cprow ${COMP.hidden?'masked':''}">
      <span class="rn serifnum">${esc(String(r.n))}</span>
      <span class="rt">${COMP.hidden?T.hiddenMark:esc(String(r.text))}</span>
      <span class="rp serifnum">${COMP.hidden?'':esc(String(r.pts))}</span></div>`).join('')}</div>
    <div class="cpnav">
      <button class="btn btn-quiet" data-act="compprev" ${COMP.idx===0?'disabled':''}>${T.prevItem}</button>
      <button class="btn btn-gold" data-act="compnext" ${COMP.idx>=items.length-1?'disabled':''}>${T.nextItem}</button>
    </div>
  </div></div>`;
}

  return `url("data:image/svg+xml,${svg}")`;
}
boot();
